<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			performance.mark('matrixhub:boot:start');
			(() => {
				const defaultTheme = 'business';
				const lightThemes = new Set(['corporate', 'light', 'nord', 'retro']);
				let theme = defaultTheme;

				try {
					const stored = localStorage.getItem('theme_settings');
					if (stored) {
						const parsed = JSON.parse(stored);
						if (typeof parsed?.theme === 'string') {
							theme = parsed.theme;
						}
					}
				} catch {
					theme = defaultTheme;
				}

				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.style.colorScheme = lightThemes.has(theme) ? 'light' : 'dark';
			})();
		</script>
		<style>
			#matrixhub-boot-fallback {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				background: var(--color-base-100, Canvas);
				color: var(--color-base-content, CanvasText);
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
			}

			.matrixhub-boot-panel {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				font-weight: 700;
				letter-spacing: 0;
			}

			.matrixhub-boot-spinner {
				width: 1rem;
				height: 1rem;
				border: 2px solid
					color-mix(in oklab, var(--color-base-content, CanvasText) 24%, transparent);
				border-top-color: var(--color-primary, currentColor);
				border-radius: 9999px;
				animation: matrixhub-boot-spin 0.8s linear infinite;
			}

			@keyframes matrixhub-boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="matrixhub-boot-fallback" aria-live="polite" aria-label="MatrixHub" aria-busy="true">
			<div class="matrixhub-boot-panel">
				<div class="matrixhub-boot-spinner" aria-hidden="true"></div>
				<div>MatrixHub</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
